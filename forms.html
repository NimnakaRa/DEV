<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Demo</title>
</head>

<body>
    <h1>Forms</h1>

    <form action="/tacos">





        <p>
            <label for="username">Enter a Username</label>
            <input id="username" type="text" placeholder="Username" name="username">
        </p>

        <p>
            <label for="password">Enter a Password</label>
            <input id="password" type="password" placeholder="Password" name="password">
        </p>

        <p>
            <label for="color">Enter a Colour</label>
            <input type="color" id="color" name="color">
        </p>

        <p>
            <label for="number">Enter a Number</label>
            <input type="number" placeholder="Number" id="number" name="number">
        </p>

        <button>Submit</button>
    </form>
    <br>
    <h2>Hijacking Searches</h2>
    <h3>Reddit</h3>
    <form action="https://www.reddit.com/search">
        <input type="text" name="q" id="redditsearch">
        <button>Search Reddit</button>
    </form>
    <br>
    <h3>Google</h3>
    <form action="https://www.google.com/search">
        <input type="text" name="q" id="googlesearch">
        <button>Search Google</button>
    </form>

    <h2>More inputs</h2>
    <form action="/birds">
        <label for="agree">I agree to everything</label>
        <input type="checkbox" name="agree_tos" id="agree">
        <p>
            <label for="S">Small</label>
            <input type="radio" name="size" id="S" value="S">

            <label for="M">Medium</label>
            <input type="radio" name="size" id="M" value="M">

            <label for="L">Large</label>
            <input type="radio" name="size" id="L" value="L">

            <label for="XL">Xtra Large</label>
            <input type="radio" name="size" id="XL" value="XL">
        </p>
        <p>
            <label for="entre">Please Select a meal type</label>
            <select name="meal" id="meal">
                <option value="fish">Fish</option>
                <option value="veggie">Vegetarian</option>
                <option value="steak">Steak</option>
            </select>
        </p>

        <label for="cheese">Amount of Cheese</label>
        <input type="range" name="cheese" id="cheese" min="1" max="100" value="75" step="2">
        <br>

        <p>
            <label for="requests">Any Special Requests</label>
            <textarea name="req" id="requests" rows="5" cols="5"></textarea>
        </p>
        <button>Submit</button>
    </form>

</body>

</html>
